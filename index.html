
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pratico Risanamento CCII</title>
    
    <!-- Dipendenze esterne via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print { .no-print { display: none !important; } }
        /* Custom scrollbar per un look più pulito */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- COSTANTI E LOGICA DI CALCOLO ---
        const DifficultyLevel = {
            FAVOREVOLE: 'FAVOREVOLE',
            CONTENUTO: 'CONTENUTO',
            SIGNIFICATIVO: 'SIGNIFICATIVO',
            GRAVE: 'GRAVE',
            CRITICO: 'CRITICO'
        };

        const formatCurrency = (value) => {
            return new Intl.NumberFormat('it-IT', {
                style: 'currency',
                currency: 'EUR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0,
            }).format(value);
        };

        const calculateTest = (data) => {
            const numeratore = Number(data.n1) + Number(data.n2) + Number(data.n3) + Number(data.n4) + Number(data.n5) - Number(data.n6) - Number(data.n7) - Number(data.n8);
            const denominatore = Number(data.d1) - Number(data.d2) - Number(data.d3);

            if (denominatore <= 0) {
                return {
                    numeratore,
                    denominatore,
                    rapporto: 'N/A',
                    livello: DifficultyLevel.CRITICO,
                    colore: 'bg-black text-white',
                    diagnosi: "Flussi di cassa operativi nulli o negativi",
                    azione: "Risanamento non perseguibile con soli flussi operativi. Necessari interventi straordinari (es. apporti di capitale, dismissioni o ristrutturazione del debito)."
                };
            }

            const rapporto = numeratore / denominatore;

            if (rapporto < 0) {
                return {
                    numeratore,
                    denominatore,
                    rapporto,
                    livello: DifficultyLevel.FAVOREVOLE,
                    colore: 'bg-green-600 text-white',
                    diagnosi: "Posizione finanziaria netta complessiva favorevole",
                    azione: "Nessuna criticità rilevata. L'impresa dispone di risorse o flussi sufficienti a coprire il fabbisogno."
                };
            } else if (rapporto <= 2) {
                return {
                    numeratore,
                    denominatore,
                    rapporto,
                    livello: DifficultyLevel.CONTENUTO,
                    colore: 'bg-green-500 text-white',
                    diagnosi: `Difficoltà contenute. Rientro stimato in circa ${rapporto.toFixed(1)} anni.`,
                    azione: "Soluzione endogena all'impresa (continuità diretta)."
                };
            } else if (rapporto <= 4) {
                return {
                    numeratore,
                    denominatore,
                    rapporto,
                    livello: DifficultyLevel.SIGNIFICATIVO,
                    colore: 'bg-orange-500 text-white',
                    diagnosi: `Squilibrio significativo. Rientro stimato in circa ${rapporto.toFixed(1)} anni.`,
                    azione: "Necessario piano d'impresa solido. Il risanamento dipende strettamente dall'efficacia delle iniziative industriali previste."
                };
            } else {
                return {
                    numeratore,
                    denominatore,
                    rapporto,
                    livello: DifficultyLevel.GRAVE,
                    colore: 'bg-red-600 text-white',
                    diagnosi: `Squilibrio grave. Rientro stimato in circa ${rapporto.toFixed(1)} anni.`,
                    azione: "Valutare cessioni/cessazioni di rami d'azienda, aggregazioni con altre imprese o disinvestimenti straordinari."
                };
            }
        };

        // --- COMPONENTI ---
        const InputGroup = ({ label, id, value, onChange, tooltip, sign }) => {
            const getSignColor = () => {
                if (sign === '+') return 'text-red-600';
                if (sign === '-') return 'text-green-600';
                return 'text-gray-400';
            };

            return (
                <div className="mb-4">
                    <div className="flex justify-between items-center mb-1">
                        <label htmlFor={id} className="text-sm font-semibold text-gray-700 flex items-center gap-2">
                            {label}
                            <span className="cursor-help text-gray-400" title={tooltip}>
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            </span>
                        </label>
                        {sign && (
                            <span className={`text-xs font-bold uppercase ${getSignColor()}`}>
                                {sign === 'info' ? 'Nota' : sign}
                            </span>
                        )}
                    </div>
                    <div className="relative">
                        <input
                            type="number"
                            id={id}
                            value={value === 0 ? '' : value}
                            placeholder="0"
                            onChange={(e) => onChange(id, e.target.value)}
                            className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none transition-all pr-8"
                        />
                        <span className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">€</span>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [data, setData] = useState({
                azienda: '', piva: '', data_test: new Date().toISOString().split('T')[0],
                n1: 0, n1_ruolo: 0, n2: 0, n3: 0, n4: 0, n5: 0, n6: 0, n7: 0, n8: 0,
                d1: 0, d2: 0, d3: 0
            });
            const [result, setResult] = useState(calculateTest(data));

            useEffect(() => {
                setResult(calculateTest(data));
            }, [data]);

            const handleInputChange = (id, value) => {
                setData(prev => ({ ...prev, [id]: value }));
            };

            const exportPDF = () => {
                const element = document.getElementById('report-container');
                const opt = {
                    margin: 10,
                    filename: `Test_CCII_${data.azienda || 'Export'}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save();
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div id="report-container" className="max-w-5xl mx-auto bg-white shadow-xl rounded-xl overflow-hidden border border-gray-200">
                        
                        <header className="bg-slate-900 text-white p-6 md:p-10">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h1 className="text-2xl md:text-3xl font-bold tracking-tight">Test Pratico CCII</h1>
                                    <p className="text-slate-400 mt-1 text-sm md:text-base">Art. 3, comma 3, D.Lgs. 14/2019 – DD 21/03/2023</p>
                                </div>
                                <button onClick={exportPDF} className="no-print bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-semibold flex items-center gap-2 transition-all shadow-lg active:scale-95">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                        <path fillRule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clipRule="evenodd" />
                                    </svg>
                                    Esporta Risultati
                                </button>
                            </div>
                        </header>

                        <div className="p-6 md:p-10 space-y-10">
                            <section className="grid grid-cols-1 md:grid-cols-3 gap-6 pb-8 border-b border-gray-100">
                                <div>
                                    <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Impresa (opzionale)</label>
                                    <input type="text" value={data.azienda} onChange={(e) => handleInputChange('azienda', e.target.value)} className="w-full border-b border-gray-200 focus:border-indigo-500 outline-none py-1 transition-colors" placeholder="Ragione Sociale" />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">P.IVA (opzionale)</label>
                                    <input type="text" value={data.piva} onChange={(e) => handleInputChange('piva', e.target.value)} className="w-full border-b border-gray-200 focus:border-indigo-500 outline-none py-1 transition-colors" placeholder="00000000000" />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Data Elaborazione</label>
                                    <input type="date" value={data.data_test} onChange={(e) => handleInputChange('data_test', e.target.value)} className="w-full border-b border-gray-200 focus:border-indigo-500 outline-none py-1 transition-colors" />
                                </div>
                            </section>

                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
                                <div className="lg:col-span-8 space-y-10">
                                    <section>
                                        <div className="flex items-center gap-2 mb-6 text-indigo-700">
                                            <span className="bg-indigo-50 w-8 h-8 rounded-lg flex items-center justify-center font-bold">N</span>
                                            <h2 className="text-xl font-bold">Debito da Ristrutturare</h2>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8">
                                            <InputGroup label="Debito scaduto" id="n1" value={data.n1} onChange={handleInputChange} sign="+" tooltip="Debiti esigibili (tributari, contributivi, fornitori) comprensivi di interessi e sanzioni." />
                                            <InputGroup label="di cui iscrizioni a ruolo" id="n1_ruolo" value={data.n1_ruolo} onChange={handleInputChange} sign="info" tooltip="Sottodettaglio informativo relativo a iscrizioni a ruolo (già incluso in N1)." />
                                            <InputGroup label="Debito riscadenziato" id="n2" value={data.n2} onChange={handleInputChange} sign="+" tooltip="Dilazioni fornitori, moratorie bancarie o sospensioni riscossione." />
                                            <InputGroup label="Linee di credito revocate" id="n3" value={data.n3} onChange={handleInputChange} sign="+" tooltip="Utilizzi di linee di credito di cui non si attende il rinnovo." />
                                            <InputGroup label="Rate mutui (24 mesi)" id="n4" value={data.n4} onChange={handleInputChange} sign="+" tooltip="Rate in scadenza nei successivi 2 anni comprensive di interessi." />
                                            <InputGroup label="Investimenti risanamento" id="n5" value={data.n5} onChange={handleInputChange} sign="+" tooltip="Fabbisogno investimenti per ripristinare la normale operatività nei 12 mesi." />
                                            <InputGroup label="Risorse da dismissioni" id="n6" value={data.n6} onChange={handleInputChange} sign="-" tooltip="Cassa ritraibile da vendita cespiti o rami d'azienda." />
                                            <InputGroup label="Nuova finanza/soci" id="n7" value={data.n7} onChange={handleInputChange} sign="-" tooltip="Aumenti di capitale o finanziamenti soci già deliberati." />
                                            <InputGroup label="MON Negativo 1° anno" id="n8" value={data.n8} onChange={handleInputChange} sign="-" tooltip="Se il primo anno genera perdite operative, indicare il fabbisogno relativo." />
                                        </div>
                                    </section>

                                    <section>
                                        <div className="flex items-center gap-2 mb-6 text-emerald-700">
                                            <span className="bg-emerald-50 w-8 h-8 rounded-lg flex items-center justify-center font-bold">D</span>
                                            <h2 className="text-xl font-bold">Flussi Liberi Operativi Annui</h2>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8">
                                            <InputGroup label="MOL prospettico a regime" id="d1" value={data.d1} onChange={handleInputChange} sign="+" tooltip="Margine Operativo Lordo normalizzato annuo previsto a regime." />
                                            <InputGroup label="Investimenti mantenimento" id="d2" value={data.d2} onChange={handleInputChange} sign="-" tooltip="Capex annua necessaria per il mantenimento degli impianti/attività." />
                                            <InputGroup label="Imposte sul reddito stimate" id="d3" value={data.d3} onChange={handleInputChange} sign="-" tooltip="IRES/IRAP annue stimate a regime." />
                                        </div>
                                    </section>
                                </div>

                                <div className="lg:col-span-4">
                                    <div className="sticky top-8 space-y-6">
                                        <div className={`p-6 rounded-2xl shadow-xl transition-all duration-700 ${result.colore}`}>
                                            <div className="text-[10px] font-bold opacity-70 uppercase tracking-widest mb-1">Rapporto N/D</div>
                                            <div className="text-6xl font-black mb-6">
                                                {typeof result.rapporto === 'number' ? result.rapporto.toFixed(2) : result.rapporto}
                                            </div>
                                            <div className="space-y-4">
                                                <div>
                                                    <h4 className="text-[10px] font-bold uppercase tracking-widest opacity-60">Livello Difficoltà</h4>
                                                    <p className="text-2xl font-bold">{result.livello}</p>
                                                </div>
                                                <div className="pt-4 border-t border-white/20">
                                                    <p className="text-sm leading-relaxed font-medium">{result.diagnosi}</p>
                                                </div>
                                                <div className="bg-white/10 p-4 rounded-xl">
                                                    <h4 className="text-[10px] font-bold uppercase tracking-widest opacity-60 mb-2">Azione Suggerita</h4>
                                                    <p className="text-sm italic leading-snug">{result.azione}</p>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-white border border-gray-200 p-6 rounded-2xl space-y-4">
                                            <h3 className="font-bold text-gray-800 border-b border-gray-50 pb-2">Sintesi Calcoli</h3>
                                            <div className="flex justify-between text-sm">
                                                <span className="text-gray-500">Debito Netto (N)</span>
                                                <span className="font-bold text-red-600">{formatCurrency(result.numeratore)}</span>
                                            </div>
                                            <div className="flex justify-between text-sm">
                                                <span className="text-gray-500">Flussi Liberi (D)</span>
                                                <span className="font-bold text-emerald-600">{formatCurrency(result.denominatore)}</span>
                                            </div>
                                            <div className="pt-4 border-t border-gray-100 italic">
                                                <p className="text-[9px] text-gray-400 leading-tight">
                                                    Il test ha valenza puramente indicativa (par. 2.3, Sez. III, DD 21/03/2023). Evitare interpretazioni standardizzate.
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <footer className="bg-gray-50 border-t border-gray-100 p-8 text-center">
                            <p className="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em]">
                                Dashboard Professionale CCII - © 2024
                            </p>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
